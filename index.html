<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚔️ Batalha de Palitos - Multiplayer Wi-Fi</title>
<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{background:#0a0714;width:100vw;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.health-top{width:100%;padding:4px 12px;display:flex;justify-content:space-between;align-items:center;background:rgba(20,14,35,.95);backdrop-filter:blur(10px);border-bottom:1px solid rgba(241,196,15,.2);height:42px;z-index:10;flex-shrink:0}
.player-box{display:flex;align-items:center;gap:8px;flex:1}
.player-box.right{flex-direction:row-reverse}
.player-label{color:#fff;font-weight:800;font-size:11px;letter-spacing:1px;text-shadow:0 2px 4px rgba(0,0,0,.5)}
.health-bar{width:100px;height:12px;background:#0a0812;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.health-fill{height:100%;transition:width.4s cubic-bezier(.4,0,.2,1);border-radius:10px}
.green-fill{background:linear-gradient(90deg,#00ff88,#2ecc71);box-shadow:0 0 10px rgba(46,204,113,.6)}
.red-fill{background:linear-gradient(90deg,#ff4757,#e74c3c);box-shadow:0 0 10px rgba(231,76,60,.6)}
.center-info{text-align:center}
.vs-text{color:#fff;font-weight:900;font-size:11px;background:linear-gradient(90deg,#f1c40f,#f39c12);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.time-text{color:#f1c40f;font-size:8px;font-weight:600;opacity:.9}
.turn-line{width:100%;padding:3px 6px;text-align:center;background:linear-gradient(90deg,rgba(241,196,15,.15),rgba(241,196,15,.05));color:#f1c40f;font-weight:700;font-size:10px;letter-spacing:0.5px;border-bottom:1px solid rgba(241,196,15,.1);flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.canvas-container{flex:1;display:flex;justify-content:center;align-items:center;position:relative;overflow:hidden;width:100%;min-height:0}
canvas{width:100%;height:100%;display:block}
.controls{width:100%;padding:6px 10px;padding-bottom:calc(6px + env(safe-area-inset-bottom, 0px));background:rgba(18,13,32,.98);border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;gap:10px;flex-shrink:0;flex-wrap:wrap;z-index:20}
.pad-group{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.04);padding:4px 6px;border-radius:10px;border:1px solid rgba(255,255,255,.08)}
.pad-label{color:#888;font-size:8px;font-weight:800;letter-spacing:1px}
.btn-game{background:linear-gradient(180deg,#3a2d5e,#2b1f47);color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:8px;font-weight:700;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform.1s;cursor:pointer;outline:none}
.btn-game:active,.btn-game.active-key{transform:scale(.93);background:#4a3a75}
.btn-move{width:36px;height:38px;font-size:13px}
.btn-aim{width:32px;height:38px;font-size:12px}
.btn-fire-direct{width:54px;height:38px;background:linear-gradient(180deg,#ffd32a,#ff6b00);color:#000;font-weight:900;border:none;border-radius:10px;box-shadow:0 0 10px rgba(255,107,0,.5),0 2px 4px rgba(0,0,0,.3);font-size:10px;line-height:1.1;transition:transform.1s;cursor:pointer;outline:none}
.btn-fire-direct:active,.btn-fire-direct.active-key{transform:scale(.92)}
.ammo-btn{width:34px;height:38px;border-radius:8px;background:#2b1f47;color:#fff;font-size:14px;border:2px solid rgba(255,255,255,.15);cursor:pointer;outline:none;transition:all.2s}
.ammo-btn.active{background:linear-gradient(180deg,#f1c40f,#d48806);color:#000;box-shadow:0 0 10px rgba(241,196,15,.8);border-color:#fff}
.ammo-btn.red-ammo.active{background:linear-gradient(180deg,#ff4757,#e74c3c);color:#fff;box-shadow:0 0 10px rgba(231,76,60,.9);border-color:#fff}
.ammo-btn.green-ammo.active{background:linear-gradient(180deg,#2ecc71,#27ae60);color:#fff;box-shadow:0 0 10px rgba(46,204,113,.9);border-color:#fff}
.ammo-btn.yellow-ammo.active{background:linear-gradient(180deg,#f1c40f,#f39c12);color:#000;box-shadow:0 0 10px rgba(241,196,15,.9);border-color:#fff}
.ammo-btn:disabled{opacity:0.3;cursor:not-allowed}
.ai-ammo-indicator{position:absolute;top:8px;right:8px;background:rgba(231,76,60,.95);color:#fff;padding:4px 10px;border-radius:16px;font-size:10px;font-weight:700;display:none;box-shadow:0 4px 12px rgba(0,0,0,.4);z-index:15}
.modal-overlay{position:absolute;inset:0;background:rgba(5,3,12,.92);backdrop-filter:blur(8px);display:flex;justify-content:center;align-items:center;z-index:100;opacity:0;pointer-events:none;transition:opacity.3s}
.modal-overlay.active{opacity:1;pointer-events:auto}
.modal-card{background:linear-gradient(180deg,#241b3f,#1a132e);border:2px solid #f1c40f;border-radius:18px;padding:20px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 30px rgba(241,196,15,.2);width:300px;display:flex;flex-direction:column;gap:12px}
.modal-title{font-size:16px;font-weight:900;color:#fff}
.modal-desc{color:#b8b0d0;font-size:11px}
.modal-btns{display:flex;flex-direction:column;gap:8px}
.btn-modal{background:linear-gradient(180deg,#00d26a,#27ae60);color:#fff;border:none;padding:10px;font-size:12px;font-weight:800;border-radius:8px;cursor:pointer;width:100%;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.btn-modal.secondary{background:linear-gradient(180deg,#3498db,#2471a3)}
.net-input{width:100%;padding:8px;border-radius:8px;border:2px solid #4a3a75;background:#140e22;color:#fff;text-align:center;font-size:14px;outline:none}
#powerText{font-size:9px;font-weight:900}
</style>
</head>
<body oncontextmenu="return false;">
<div class="health-top">
<div class="player-box"><span class="player-label" id="playerTeamLabel">🟢 JOGADOR 1</span><div class="health-bar"><div id="healthGreen" class="health-fill green-fill" style="width:100%"></div></div></div>

      <button class="btn-modal" style="background:#555;font-size:11px;padding:8px;" onclick="startSinglePlayer()">Jogar Sozinho (Modo IA)</button>
    </div>
  </div>
</div>
</div>
<div class="controls">
<div class="pad-group"><span class="pad-label">MOV</span><button class="btn-game btn-move" id="moveLeftBtn" title="Tecla 4">◀ (4)</button><button class="btn-game btn-aim" id="forceMinusBtn" title="Tecla 1">➖ (1)</button><button class="btn-fire-direct" id="fireBtn" title="Tecla 5 / OK / Espaço">🔥<br><span id="powerText">40%</span></button><button class="btn-game btn-aim" id="forcePlusBtn" title="Tecla 3">➕ (3)</button><button class="btn-game btn-move" id="moveRightBtn" title="Tecla 6">▶ (6)</button></div>
<div class="pad-group"><span class="pad-label">MIRA</span><button class="btn-game btn-aim" id="anglePlusBtn" title="Tecla 2">🔼 (2)</button><button class="btn-game btn-aim" id="angleMinusBtn" title="Tecla 8">🔽 (8)</button><button class="ammo-btn red-ammo active" data-weapon="0" title="Vermelho: Normal">🔴</button><button class="ammo-btn green-ammo" data-weapon="1" title="Verde: Maior Dano">🟢</button><button class="ammo-btn yellow-ammo" data-weapon="2" id="yellowAmmoBtn" title="Amarelo: Triplo Guiado (1x por rodada)">🟡</button></div>
</div>
