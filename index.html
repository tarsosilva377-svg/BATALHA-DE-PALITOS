<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚔️ Batalha de Palitos - CORRIGIDO</title>
<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{background:#0a0714;width:100vw;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.health-top{width:100%;padding:4px 12px;display:flex;justify-content:space-between;align-items:center;background:rgba(20,14,35,.95);border-bottom:1px solid rgba(241,196,15,.2);height:44px;z-index:10;flex-shrink:0}
.player-box{display:flex;align-items:center;gap:8px;flex:1}
.player-box.right{flex-direction:row-reverse}
.player-label{color:#fff;font-weight:800;font-size:11px}
.health-bar{width:110px;height:12px;background:#0a0812;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.2)}
.health-fill{height:100%;transition:width .3s;border-radius:10px}
.green-fill{background:linear-gradient(90deg,#00ff88,#2ecc71)}
.red-fill{background:linear-gradient(90deg,#ff4757,#e74c3c)}
.center-info{text-align:center}
.vs-text{color:#f1c40f;font-weight:900;font-size:12px}
.time-text{color:#f1c40f;font-size:9px;font-weight:600;opacity:.9}
.turn-line{width:100%;padding:4px 6px;text-align:center;background:rgba(241,196,15,.1);color:#f1c40f;font-weight:700;font-size:10px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.canvas-container{flex:1;display:flex;justify-content:center;align-items:center;position:relative;overflow:hidden;width:100%}
canvas{width:100%;height:100%;display:block}
.controls{width:100%;padding:6px 10px;background:rgba(18,13,32,.98);border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:60px;flex-shrink:0}
.pad-group{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.04);padding:4px 6px;border-radius:10px;border:1px solid rgba(255,255,255,.08)}
.pad-label{color:#888;font-size:8px;font-weight:800}
.btn-game{background:#3a2d5e;color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:8px;font-weight:700;cursor:pointer;outline:none}
.btn-game:active,.active-key{transform:scale(.93);background:#4a3a75}
.btn-move{width:36px;height:38px;font-size:14px}
.btn-aim{width:32px;height:38px;font-size:12px}
.btn-fire-direct{width:54px;height:38px;background:linear-gradient(180deg,#ffd32a,#ff6b00);color:#000;font-weight:900;border:none;border-radius:10px;font-size:10px;cursor:pointer}
.ammo-btn{width:32px;height:38px;border-radius:8px;background:#2b1f47;color:#fff;font-size:14px;border:1px solid rgba(255,255,255,.1);cursor:pointer}
.ammo-btn.active{background:#f1c40f;color:#000}
.ammo-btn:disabled{opacity:0.3}
.ai-ammo-indicator{position:absolute;top:8px;right:8px;background:rgba(231,76,60,.95);color:#fff;padding:4px 10px;border-radius:16px;font-size:10px;font-weight:700;display:none;z-index:15}
.modal-overlay{position:absolute;inset:0;background:rgba(5,3,12,.9);backdrop-filter:blur(8px);display:flex;justify-content:center;align-items:center;z-index:100;opacity:0;pointer-events:none;transition:opacity.3s}
.modal-overlay.active{opacity:1;pointer-events:auto}
.modal-card{background:#241b3f;border:2px solid #f1c40f;border-radius:18px;padding:20px;text-align:center;width:310px;display:flex;flex-direction:column;gap:10px}
.modal-title{font-size:18px;font-weight:900;color:#fff}
.modal-desc{color:#b8b0d0;font-size:12px}
.btn-modal{background:#27ae60;color:#fff;border:none;padding:10px;font-size:12px;font-weight:800;border-radius:8px;cursor:pointer;width:100%}
.btn-modal.secondary{background:#2471a3}
.net-input{width:100%;padding:8px;border-radius:6px;border:1px solid #4a3a75;background:#140e22;color:#fff;text-align:center;font-size:14px;outline:none}
</style>
</head>
<body>
<div class="health-top">
<div class="player-box"><span class="player-label" id="playerTeamLabel">🟢 JOGADOR 1</span><div class="health-bar"><div id="healthGreen" class="health-fill green-fill" style="width:100%"></div></div></div>
<div class="center-info"><div class="vs-text" id="stageIndicator">FASE 1</div><div class="time-text" id="timeIndicator">00:00</div></div>
<div class="player-box right"><span class="player-label" id="enemyTeamLabel">🔴 JOGADOR 2</span><div class="health-bar"><div id="healthRed" class="health-fill red-fill" style="width:100%"></div></div></div>
</div>
<div class="turn-line" id="turnIndicator">SUA VEZ</div>
<div class="canvas-container" id="canvasContainer">
<div class="ai-ammo-indicator" id="aiAmmoIndicator"></div>
<canvas id="gameCanvas"></canvas>
<div class="modal-overlay active" id="gameModal">
  <div class="modal-card">
    <div class="modal-title" id="modalTitle">⚔️ MULTIPLAYER WI-FI</div>
    <div class="modal-desc" id="modalDesc">Jogue na mesma rede Wi-Fi:</div>
    <div class="modal-btns" id="menuButtons">
      <button class="btn-modal" onclick="showHostPrompt()">Criar Sala (Host)</button>
      <button class="btn-modal secondary" onclick="showJoinPrompt()">Entrar em Sala</button>
      <button class="btn-modal" style="background:#555;" onclick="startSinglePlayer()">Jogar Sozinho</button>
    </div>
  </div>
</div>
</div>
<div class="controls">
<div class="pad-group"><span class="pad-label">MOV</span><button class="btn-game btn-move" id="moveLeftBtn">◀</button><button class="btn-game btn-aim" id="forceMinusBtn">➖</button><button class="btn-fire-direct" id="fireBtn">🔥<br><span id="powerText">40%</span></button><button class="btn-game btn-aim" id="forcePlusBtn">➕</button><button class="btn-game btn-move" id="moveRightBtn">▶</button></div>
<div class="pad-group"><span class="pad-label">MIRA</span><button class="btn-game btn-aim" id="anglePlusBtn">🔼</button><button class="btn-game btn-aim" id="angleMinusBtn">🔽</button><button class="ammo-btn red-ammo active" data-weapon="0">🔴</button><button class="ammo-btn green-ammo" data-weapon="1">🟢</button><button class="ammo-btn yellow-ammo" data-weapon="2" id="yellowAmmoBtn">🟡</button></div>
</div>
<script>
let peer=null,conn=null,isHost=false,isMultiplayer=false,localPlayerId=0;
const VIRTUAL_WIDTH=1000; // Resolução virtual fixa, corrige trajetória
const canvas=document.getElementById('gameCanvas'), container=document.getElementById('canvasContainer'), ctx=canvas.getContext('2d');
let dpr=1,logicalWidth=0,logicalHeight=0,currentStage=1,matchTime=0,scaleX=1;
let terrainHeights=[],rocks=[],tanks=[],effects=[],peakXsCache=[],projectiles=[];
let currentTankIndex=0,selectedWeapon=0,isShooting=false,moveDir=0,angleDir=0,forceDir=0;
let targetCursor={x:500,y:300,active:false}, lastFrameTime=0;

const weapons=[
  {name:'Normal',symbol:'🔴',speed:6.5,damage:35,radius:65,gravity:0.18,color:'#ff4757'},
  {name:'Bomba',symbol:'🟢',speed:6.0,damage:60,radius:95,gravity:0.20,color:'#2ecc71'},
  {name:'Triplo',symbol:'🟡',speed:5.5,damage:25,radius:50,gravity:0.12,color:'#f1c40f'}
];

function resizeCanvas(){
  dpr=window.devicePixelRatio||1;
  logicalWidth=container.clientWidth; logicalHeight=container.clientHeight;
  scaleX = logicalWidth / VIRTUAL_WIDTH;
  canvas.width=logicalWidth*dpr; canvas.height=logicalHeight*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',()=>{ resizeCanvas(); });

function seededRandom(seed){ let x=Math.sin(seed++)*10000; return x-Math.floor(x); }

function initStage(seed=Math.random()*1000){
  const baseH = logicalHeight*0.68;
  terrainHeights = new Float32Array(VIRTUAL_WIDTH+1);
  const n=2+(currentStage%3), pf=0.12, mh=90;
  peakXsCache=[];
  for(let p=1;p<=n;p++) peakXsCache.push((VIRTUAL_WIDTH/(n+1))*p + ((p%2===0)?40:-40));
  for(let x=0;x<=VIRTUAL_WIDTH;x++){
    let y=baseH;
    peakXsCache.forEach((px,i)=>{
      const norm=(x-px)/(VIRTUAL_WIDTH*pf);
      const m=Math.max(0,(1-norm*norm))*(mh*(i%2===0?1:0.85));
      y-=m;
    });
    terrainHeights[x]=Math.max(25,y);
  }
  rocks=[];
  peakXsCache.forEach(px=>{
    rocks.push({x:px-15,y:getTerrainY(px-15)-6,vx:0,vy:0,angle:seededRandom(px)*Math.PI,radius:6,peakRef:px});
    rocks.push({x:px+15,y:getTerrainY(px+15)-7,vx:0,vy:0,angle:seededRandom(px+1)*Math.PI,radius:7,peakRef:px});
  });
  tanks=[
    {id:0,team:'green',x:60,y:0,width:20,height:28,angle:45,power:40,health:100,facing:1,specialUsed:false,isMoving:false,walkCycle:0,shootTimer:0},
    {id:1,team:'red',x:VIRTUAL_WIDTH-80,y:0,width:20,height:28,angle:135,power:40,health:100,facing:-1,specialUsed:false,isMoving:false,walkCycle:0,shootTimer:0}
  ];
  tanks.forEach(t=>updateTankY(t));
  currentTankIndex=0; effects=[]; matchTime=0; projectiles=[];
}

function getTerrainY(x){
  let ix=Math.floor(Math.max(0,Math.min(VIRTUAL_WIDTH, x)));
  return terrainHeights[ix]||logicalHeight*0.68;
}
function updateTankY(t){ t.y=getTerrainY(t.x+t.width/2)-t.height; }

function destroyTerrain(cx,ra){
  const sx=Math.max(0,Math.floor(cx-ra)), ex=Math.min(VIRTUAL_WIDTH,Math.ceil(cx+ra));
  for(let x=sx;x<=ex;x++){
    const dx=x-cx;
    if(dx*dx<ra*ra){ terrainHeights[x]=Math.min(logicalHeight+50, terrainHeights[x]+Math.sqrt(ra*ra-dx*dx)*0.9); }
  }
  rocks.forEach(r=>{ if(Math.abs(r.x-cx)<ra+40){ r.vy=-3; r.vx=(r.x>cx)?2.5:-2.5; } });
  createExplosionFX(cx, getTerrainY(cx), ra);
  if(isMultiplayer && isHost && conn){
    conn.send({type:'TERRAIN_UPDATE', cx, ra, heights: Array.from(terrainHeights.slice(sx,ex+1)), sx});
  }
}
function createExplosionFX(cx,cy,ra){
  effects.push({type:'shockwave',x:cx,y:cy,radius:5,maxRadius:ra*1.2,life:1});
  for(let i=0;i<14;i++){ effects.push({type:'fire',x:cx,y:cy-5,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8-1,life:0.6,size:5,color:'#ff9900'}); }
  if(effects.length>80) effects.splice(0, effects.length-80);
}

function updatePhysicsObjects(dt){
  rocks.forEach(r=>{
    const g=getTerrainY(r.x)-r.radius;
    if(r.y<g-1
