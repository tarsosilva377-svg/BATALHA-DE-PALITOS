<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚔️ Batalha de Palitos - Multiplayer Wi-Fi</title>
<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{background:#0a0714;width:100vw;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.health-top{width:100%;padding:4px 12px;display:flex;justify-content:space-between;align-items:center;background:rgba(20,14,35,.95);backdrop-filter:blur(10px);border-bottom:1px solid rgba(241,196,15,.2);height:44px;z-index:10;flex-shrink:0}
.player-box{display:flex;align-items:center;gap:8px;flex:1}
.player-box.right{flex-direction:row-reverse}
.player-label{color:#fff;font-weight:800;font-size:11px;letter-spacing:1px;text-shadow:0 2px 4px rgba(0,0,0,.5)}
.health-bar{width:110px;height:12px;background:#0a0812;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.health-fill{height:100%;transition:width.4s cubic-bezier(.4,0,.2,1);border-radius:10px}
.green-fill{background:linear-gradient(90deg,#00ff88,#2ecc71);box-shadow:0 0 10px rgba(46,204,113,.6)}
.red-fill{background:linear-gradient(90deg,#ff4757,#e74c3c);box-shadow:0 0 10px rgba(231,76,60,.6)}
.center-info{text-align:center}
.vs-text{color:#fff;font-weight:900;font-size:12px;background:linear-gradient(90deg,#f1c40f,#f39c12);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.time-text{color:#f1c40f;font-size:9px;font-weight:600;opacity:.9}
.turn-line{width:100%;padding:4px 6px;text-align:center;background:linear-gradient(90deg,rgba(241,196,15,.15),rgba(241,196,15,.05));color:#f1c40f;font-weight:700;font-size:10px;letter-spacing:0.5px;border-bottom:1px solid rgba(241,196,15,.1);flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.canvas-container{flex:1;display:flex;justify-content:center;align-items:center;position:relative;overflow:hidden;width:100%}
canvas{width:100%;height:100%;display:block}
.controls{width:100%;padding:8px 12px;background:rgba(18,13,32,.98);border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:65px;flex-shrink:0}
.pad-group{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.04);padding:6px 8px;border-radius:12px;border:1px solid rgba(255,255,255,.08)}
.pad-label{color:#888;font-size:9px;font-weight:800;letter-spacing:1px}
.btn-game{background:linear-gradient(180deg,#3a2d5e,#2b1f47);color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:10px;font-weight:700;box-shadow:0 3px 6px rgba(0,0,0,.3);transition:transform.1s;cursor:pointer;outline:none}
.btn-game:active,.btn-game.active-key{transform:scale(.93);background:#4a3a75}
.btn-move{width:40px;height:42px;font-size:15px}
.btn-aim{width:36px;height:42px;font-size:13px}
.btn-fire-direct{width:60px;height:42px;background:linear-gradient(180deg,#ffd32a,#ff6b00);color:#000;font-weight:900;border:none;border-radius:12px;box-shadow:0 0 14px rgba(255,107,0,.5),0 3px 6px rgba(0,0,0,.3);font-size:11px;line-height:1.1;transition:transform.1s;cursor:pointer;outline:none}
.btn-fire-direct:active,.btn-fire-direct.active-key{transform:scale(.92)}
.ammo-btn{width:38px;height:42px;border-radius:10px;background:#2b1f47;color:#fff;font-size:16px;border:2px solid rgba(255,255,255,.15);cursor:pointer;outline:none;transition:all.2s}
.ammo-btn.active{background:linear-gradient(180deg,#f1c40f,#d48806);color:#000;box-shadow:0 0 12px rgba(241,196,15,.8);border-color:#fff}
.ammo-btn.red-ammo.active{background:linear-gradient(180deg,#ff4757,#e74c3c);color:#fff;box-shadow:0 0 12px rgba(231,76,60,.9);border-color:#fff}
.ammo-btn.green-ammo.active{background:linear-gradient(180deg,#2ecc71,#27ae60);color:#fff;box-shadow:0 0 12px rgba(46,204,113,.9);border-color:#fff}
.ammo-btn.yellow-ammo.active{background:linear-gradient(180deg,#f1c40f,#f39c12);color:#000;box-shadow:0 0 12px rgba(241,196,15,.9);border-color:#fff}
.ammo-btn:disabled{opacity:0.3;cursor:not-allowed}
.ai-ammo-indicator{position:absolute;top:8px;right:8px;background:rgba(231,76,60,.95);color:#fff;padding:4px 10px;border-radius:16px;font-size:10px;font-weight:700;display:none;box-shadow:0 4px 12px rgba(0,0,0,.4);z-index:15}
.modal-overlay{position:absolute;inset:0;background:rgba(5,3,12,.92);backdrop-filter:blur(8px);display:flex;justify-content:center;align-items:center;z-index:100;opacity:0;pointer-events:none;transition:opacity.3s}
.modal-overlay.active{opacity:1;pointer-events:auto}
.modal-card{background:linear-gradient(180deg,#241b3f,#1a132e);border:2px solid #f1c40f;border-radius:18px;padding:22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 30px rgba(241,196,15,.2);width:320px;display:flex;flex-direction:column;gap:12px}
.modal-title{font-size:18px;font-weight:900;color:#fff}
.modal-desc{color:#b8b0d0;font-size:12px}
.modal-btns{display:flex;flex-direction:column;gap:10px}
.btn-modal{background:linear-gradient(180deg,#00d26a,#27ae60);color:#fff;border:none;padding:12px;font-size:13px;font-weight:800;border-radius:10px;cursor:pointer;width:100%;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.btn-modal.secondary{background:linear-gradient(180deg,#3498db,#2471a3)}
.net-input{width:100%;padding:10px;border-radius:8px;border:2px solid #4a3a75;background:#140e22;color:#fff;text-align:center;font-size:15px;outline:none}
#powerText{font-size:9px;font-weight:900}
</style>
</head>
<body oncontextmenu="return false;">
<div class="health-top">
<div class="player-box"><span class="player-label" id="playerTeamLabel">🟢 JOGADOR 1</span><div class="health-bar"><div id="healthGreen" class="health-fill green-fill" style="width:100%"></div></div></div>
<div class="center-info"><div class="vs-text" id="stageIndicator">⚔️ FASE 1/20</div><div class="time-text" id="timeIndicator">🌙 00:00</div></div>
<div class="player-box right"><span class="player-label" id="enemyTeamLabel">🔴 JOGADOR 2</span><div class="health-bar"><div id="healthRed" class="health-fill red-fill" style="width:100%"></div></div></div>
</div>
<div class="turn-line" id="turnIndicator">🟢 SUA VEZ — [🛈 Mover: 4 / 6 | Mira: 2 / 8 | Força: 1 / 3 | Atirar: 5 | Munição: 🔴 / 🟢 / 🟡]</div>
<div class="canvas-container" id="canvasContainer">
<div class="ai-ammo-indicator" id="aiAmmoIndicator">🤖 Robô equipou: ⚫</div>
<canvas id="gameCanvas"></canvas>
<div class="modal-overlay active" id="gameModal">
  <div class="modal-card">
    <div class="modal-title" id="modalTitle">⚔️ MODO MULTIPLAYER WI-FI</div>
    <div class="modal-desc" id="modalDesc">Escolha como deseja jogar na TV ou com amigos na mesma rede Wi-Fi:</div>
    <div class="modal-btns" id="menuButtons">
      <button class="btn-modal" onclick="showHostPrompt()">Criar Sala (Host / TV)</button>
      <button class="btn-modal secondary" onclick="showJoinPrompt()">Entrar em Sala (Convidado)</button>
      <button class="btn-modal" style="background:#555;font-size:11px;padding:8px;" onclick="startSinglePlayer()">Jogar Sozinho (Modo IA)</button>
    </div>
  </div>
</div>
</div>
<div class="controls">
<div class="pad-group"><span class="pad-label">MOV</span><button class="btn-game btn-move" id="moveLeftBtn" title="Tecla 4">◀ (4)</button><button class="btn-game btn-aim" id="forceMinusBtn" title="Tecla 1">➖ (1)</button><button class="btn-fire-direct" id="fireBtn" title="Tecla 5 / OK / Espaço">🔥<br><span id="powerText">40%</span></button><button class="btn-game btn-aim" id="forcePlusBtn" title="Tecla 3">➕ (3)</button><button class="btn-game btn-move" id="moveRightBtn" title="Tecla 6">▶ (6)</button></div>
<div class="pad-group"><span class="pad-label">MIRA</span><button class="btn-game btn-aim" id="anglePlusBtn" title="Tecla 2">🔼 (2)</button><button class="btn-game btn-aim" id="angleMinusBtn" title="Tecla 8">🔽 (8)</button><button class="ammo-btn red-ammo active" data-weapon="0" title="Vermelho: Normal">🔴</button><button class="ammo-btn green-ammo" data-weapon="1" title="Verde: Maior Dano">🟢</button><button class="ammo-btn yellow-ammo" data-weapon="2" id="yellowAmmoBtn" title="Amarelo: Triplo Guiado (1x por rodada)">🟡</button></div>
</div>

<script>
let peer = null;
let conn = null;
let isHost = false;
let isMultiplayer = false;
let localPlayerId = 0; 

const bgMusic = new Audio('the_big_fight.mp3..oga');
bgMusic.loop = true;
bgMusic.volume = 0.1;

let musicStarted = false;
function startBgMusic() {
    if (!musicStarted) {
        bgMusic.play().then(() => { musicStarted = true; }).catch(() => {});
    }
}
window.addEventListener('click', startBgMusic, { once: true });
window.addEventListener('keydown', startBgMusic, { once: true });

const AudioFX={ctx:null,init(){if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume();},playShoot(){this.init();const n=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='triangle';o.frequency.setValueAtTime(300,n);o.frequency.exponentialRampToValueAtTime(40,n+.25);g.gain.setValueAtTime(.8,n);g.gain.exponentialRampToValueAtTime(.01,n+.25);o.connect(g);g.connect(this.ctx.destination);o.start(n);o.stop(n+.25);},playTargetLock(){this.init();const n=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='sine';o.frequency.setValueAtTime(800,n);o.frequency.setValueAtTime(1200,n+.08);g.gain.setValueAtTime(.3,n);g.gain.exponentialRampToValueAtTime(.01,n+.15);o.connect(g);g.connect(this.ctx.destination);o.start(n);o.stop(n+.15);},playExplosion(){this.init();const n=this.ctx.currentTime,s=this.ctx.sampleRate*.5,b=this.ctx.createBuffer(1,s,this.ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<s;i++)d[i]=Math.random()*2-1;const w=this.ctx.createBufferSource();w.buffer=b;const f=this.ctx.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(800,n);f.frequency.exponentialRampToValueAtTime(30,n+.5);const g=this.ctx.createGain();g.gain.setValueAtTime(1,n);g.gain.exponentialRampToValueAtTime(.01,n+.5);w.connect(f);f.connect(g);g.connect(this.ctx.destination);w.start(n);w.stop(n+.5);}};

const canvas=document.getElementById('gameCanvas');const container=document.getElementById('canvasContainer');const ctx=canvas.getContext('2d');
let dpr=window.devicePixelRatio||1,logicalWidth=0,logicalHeight=0,currentStage=1;const maxStages=20;let matchTime=0;const totalDayDuration=90;

function resizeCanvas(){
dpr=window.devicePixelRatio||1;
logicalWidth=container.clientWidth;
logicalHeight=container.clientHeight;
canvas.width=logicalWidth*dpr;
canvas.height=logicalHeight*dpr;
ctx.resetTransform();
ctx.scale(dpr,dpr);
if(!terrainHeights||terrainHeights.length===0)initStage();
}
window.addEventListener('resize',resizeCanvas);

let terrainHeights=[],rocks=[],tanks=[],effects=[],peakXsCache=[];

const weapons=[
  {name:'Normal',symbol:'🔴',speed:.21,damage:35,radius:22,gravity:.22,color:'#ff4757'},
  {name:'Bomba (Maior Dano)',symbol:'🟢',speed:.20,damage:60,radius:36,gravity:.23,color:'#2ecc71'},
  {name:'Ataque Triplo Guiado',symbol:'🟡',speed:.22,damage:25,radius:18,gravity:.18,color:'#f1c40f'}
];

function generateIrregularVertices(r){const v=[],p=5+Math.floor(Math.random()*3);for(let i=0;i<p;i++){const a=(i/p)*Math.PI*2,rv=r*(.7+Math.random()*.6);v.push({x:Math.cos(a)*rv,y:Math.sin(a)*rv});}return v;}

function initStage(){
if(isMultiplayer && !isHost) return;

const b=logicalHeight*.68;
terrainHeights=new Float32Array(Math.ceil(logicalWidth)+1);
const n=2+(currentStage%3),pf=Math.max(.06,.14-(currentStage*.003)),mh=Math.min(logicalHeight*.30,35+currentStage*2.5);
peakXsCache=[];
for(let p=1;p<=n;p++)peakXsCache.push((logicalWidth/(n+1))*p+((p%2===0)?20:-20));
for(let x=0;x<=logicalWidth;x++){
let y=b;
peakXsCache.forEach((px,i)=>{const no=(x-px)/(logicalWidth*pf),m=Math.max(0,(1-no*no))*(mh*(i%2===0?1:.85));y-=m;});
terrainHeights[x]=Math.max(25,y);
}
rocks=[];
peakXsCache.forEach(px=>{
const a=px-12,c=px+12;
rocks.push({x:a,y:getTerrainY(a)-6,vx:0,vy:0,angle:Math.random()*Math.PI,radius:6,peakRef:px,vertices:generateIrregularVertices(6)});
rocks.push({x:c,y:getTerrainY(c)-7,vx:0,vy:0,angle:Math.random()*Math.PI,radius:7,peakRef:px,vertices:generateIrregularVertices(7)});
});
tanks=[];
tanks.push({id:0,team:'green',isPlayer:true,x:30,y:0,width:20,height:28,angle:45,power:40,health:100,color:'#2ecc71',targetX:0,isMoving:false,walkCycle:0,shootTimer:0,facing:1,specialUsed:false});
tanks.push({id:1,team:'red',isPlayer:false,x:logicalWidth-50,y:0,width:20,height:28,angle:45,power:40,health:100,color:'#e74c3c',targetX:0,isMoving:false,walkCycle:0,shootTimer:0,facing:-1,specialUsed:false});

document.getElementById('playerTeamLabel').textContent=isMultiplayer?(localPlayerId===0?'🟢 JOGADOR 1':'🔴 JOGADOR 2'):'🟢 JOGADOR 1';
document.getElementById('enemyTeamLabel').textContent=isMultiplayer?(localPlayerId===0?'🔴 JOGADOR 2':'🟢 JOGADOR 1'):'🤖 ROBÔ';

tanks.forEach(t=>updateTankY(t));currentTankIndex=0;effects=[];matchTime=0;
document.getElementById('stageIndicator').textContent=`⚔️ FASE ${currentStage}/${maxStages}`;

if(isMultiplayer && isHost && conn) {
  sendStageDataToClient();
}
}

function sendStageDataToClient() {
  if(conn && isHost) {
    conn.send({
      type: 'STAGE_DATA',
      terrainHeights: Array.from(terrainHeights),
      tanks: tanks,
      peakXsCache: peakXsCache,
      rocks: rocks,
      hostWidth: logicalWidth,
      hostHeight: logicalHeight
    });
  }
}

function getTerrainY(x){const i=Math.floor(x);if(i<0)return terrainHeights[0]||logicalHeight*.68;if(i>=logicalWidth)return terrainHeights[Math.floor(logicalWidth)]||logicalHeight*.68;return terrainHeights[i];}

function updatePhysicsObjects(){
rocks.forEach(r=>{
const g=getTerrainY(r.x)-r.radius;
if(r.y<g-2||Math.abs(r.vy||0)>.1){r.vy=(r.vy||0)+.18;r.y+=r.vy;const ly=getTerrainY(r.x-2),ry=getTerrainY(r.x+2),s=(ry-ly)/4;r.vx=(r.vx||0)*.92+s*.25;r.x+=r.vx;r.angle+=r.vx*.04;r.x=Math.max(10,Math.min(logicalWidth-10,r.x));if(r.y>=g){r.y=g;r.vy=0;if(Math.abs(r.vx)<.1){r.vx=0;r.vy=0;}}}else r.y=g;
});
for(let i=effects.length-1;i>=0;i--){let e=effects[i];e.life-=.045;e.x+=e.vx;e.y+=e.vy;if(e.type==='smoke'||e.type==='fire')e.size=(e.size||2)+0.4;if(e.life<=0)effects.splice(i,1);}
}

function destroyTerrain(cx,ra,dp){
const sx=Math.max(0,Math.floor(cx-ra)),ex=Math.min(logicalWidth,Math.ceil(cx+ra));
for(let x=sx;x<=ex;x++){
const dx=x-cx;
if(dx*dx<ra*ra){terrainHeights[x]=Math.min(logicalHeight+20,terrainHeights[x]+Math.sqrt(ra*ra-dx*dx)*.8);}
}
let ap=peakXsCache[0],md=Math.abs(cx-peakXsCache[0]);
peakXsCache.forEach(px=>{let d=Math.abs(cx-px);if(d<md){md=d;ap=px;}});
rocks.forEach(r=>{const d=Math.hypot(cx-r.x,r.y-getTerrainY(r.x));if(r.peakRef===ap&&d<=ra+30){r.vy=-2.5;r.vx=(r.x>cx)?2.8:-2.8;}});
effects.push({type:'shockwave',x:cx,y:getTerrainY(cx),radius:5,maxRadius:ra*1.2,life:1});
for(let p=0;p<20;p++){let a=Math.random()*Math.PI*2,s=1+Math.random()*6;effects.push({type:'fire',x:cx,y:getTerrainY(cx)-5,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:.6+Math.random()*.4,size:4+Math.random()*6,color:Math.random()>.3?'#ff9900':'#ff3300'});}
for(let p=0;p<12;p++){let a=-Math.PI/2+(Math.random()*1.2-0.6),s=2+Math.random()*5;effects.push({type:'smoke',x:cx,y:getTerrainY(cx)-5,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.6+Math.random()*.4,size:6+Math.random()*8});}
for(let p=0;p<12;p++){let a=Math.random()*Math.PI*2,s=2+Math.random()*5;effects.push({type:'debris',x:cx,y:getTerrainY(cx)-5,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:.7+Math.random()*.3,size:2+Math.random()*3});}
}

function updateTankY(t){t.y=getTerrainY(t.x+t.width/2)-t.height;}

let currentTankIndex=0,selectedWeapon=0,isShooting=false,projectiles=[],moveDir=0,angleDir=0,forceDir=0;
let targetCursor={x:0,y:0,active:false};

function fireProjectile(){
if(isShooting)return;
let t=tanks[currentTankIndex];
if(isMultiplayer && ((localPlayerId === 0 && t.team !== 'green') || (localPlayerId === 1 && t.team !== 'red'))) return;

let wi=selectedWeapon;
if(!t.isPlayer && !isMultiplayer){
wi=t.chosenWeapon!==undefined?t.chosenWeapon:0;
document.getElementById('aiAmmoIndicator').textContent=`🤖 Robô equipou: ${weapons[wi].symbol}`;
document.getElementById('aiAmmoIndicator').style.display='block';
}else document.getElementById('aiAmmoIndicator').style.display='none';

if(wi===2){
if(t.specialUsed)return;
t.specialUsed=true;
if(t.isPlayer || (isMultiplayer && t.id === localPlayerId)) document.getElementById('yellowAmmoBtn').disabled = true;
}

if(isMultiplayer && conn){
  conn.send({type:'FIRE', tankIndex: currentTankIndex, weapon: wi, angle: t.angle, power: t.power, targetX: targetCursor.x, targetY: targetCursor.y});
}

executeFireAction(currentTankIndex, wi, t.angle, t.power, targetCursor.x, targetCursor.y);
}

function executeFireAction(tankIdx, wi, ang, pow, tx, ty){
let t = tanks[tankIdx];
if(!t || t.health <= 0) return;
t.angle = ang;
t.power = pow;

isShooting=true;AudioFX.playShoot();
t.shootTimer=18;
const w=weapons[wi];
const rad = t.angle * Math.PI / 180;
const pm = .5 + (t.power / 100) * 2.2;
const bs = w.speed * pm * (logicalWidth / 12);
const hx = t.x + t.width / 2;
const sy = t.y + 10;

projectiles=[];

if(wi===2){
let enemy = tanks.find(tk => tk.team !== t.team);
let defaultTx = enemy ? (enemy.x + enemy.width/2) : logicalWidth/2;
let defaultTy = enemy ? enemy.y : logicalHeight/2;

const tgtX = (isMultiplayer && tx > 0) ? tx : defaultTx;
const tgtY = (isMultiplayer && ty > 0) ? ty : defaultTy;
targetCursor.active = false;

for(let i=-1; i<=1; i++){
const spreadAngle = (-Math.PI / 2) + (i * 0.25);
const speed = 4.5;
projectiles.push({
x: hx + (i * 10),
y: sy - 15,
vx: Math.cos(spreadAngle) * speed,
vy: Math.sin(spreadAngle) * speed,
radius: 3.5, explosionRadius: w.radius, gravity: 0, damage: w.damage, color: w.color,
shooterTeam: t.team, shooterId: t.id, trail: [],
isGuided: true, targetX: tgtX + (i * 12), targetY: tgtY,
lifeTime: 0
});
}
}else{
const vx = Math.cos(rad) * bs * t.facing;
const vy = -Math.sin(rad) * bs;
projectiles.push({
x: hx + Math.cos(rad)*18*t.facing,
y: sy - Math.sin(rad)*18,
vx: vx, vy: vy,
radius: 3, explosionRadius: w.radius, gravity: w.gravity, damage: w.damage, color: w.color,
shooterTeam: t.team, shooterId: t.id, trail: []
});
}

for(let p=0;p<8;p++){let fa=rad+(Math.random()*.4-.2),fs=1+Math.random()*3;effects.push({type:'fire',x:hx+Math.cos(rad)*18*t.facing,y:sy-Math.sin(rad)*18,vx:Math.cos(fa)*fs*t.facing,vy:-Math.sin(fa)*fs,life:.3,size:3+Math.random()*4,color:'#ffaa00'});}
}

function drawWorld(){
matchTime+=1/60;let dp=Math.min(1,matchTime/totalDayDuration);
let skyGrad=ctx.createLinearGradient(0,0,0,logicalHeight);
skyGrad.addColorStop(0,'#3b1e54');skyGrad.addColorStop(0.35,'#9c3d54');skyGrad.addColorStop(0.65,'#d76f30');skyGrad.addColorStop(1,'#f3a953');
ctx.fillStyle=skyGrad;ctx.fillRect(0,0,logicalWidth,logicalHeight);

ctx.save();
ctx.fillStyle='rgba(255,230,200,0.85)';ctx.beginPath();ctx.arc(logicalWidth*0.5,logicalHeight*0.55,30,0,Math.PI*2);ctx.fill();
let sunGlow=ctx.createRadialGradient(logicalWidth*0.5,logicalHeight*0.55,30,logicalWidth*0.5,logicalHeight*0.55,100);
sunGlow.addColorStop(0,'rgba(255,180,80,0.4)');sunGlow.addColorStop(1,'rgba(255,100,0,0)');
ctx.fillStyle=sunGlow;ctx.beginPath();ctx.arc(logicalWidth*0.5,logicalHeight*0.55,100,0,Math.PI*2);ctx.fill();
ctx.restore();

ctx.fillStyle='#512347';ctx.beginPath();ctx.moveTo(0,logicalHeight);
for(let x=0;x<=logicalWidth;x+=10){let y=logicalHeight*0.45+Math.sin(x*0.008)*25+Math.cos(x*0.02)*12;ctx.lineTo(x,y);}

ctx.fillStyle='#36173a';ctx.beginPath();ctx.moveTo(0,logicalHeight);
for(let x=0;x<=logicalWidth;x+=8){let y=logicalHeight*0.52+Math.sin(x*0.012+1)*20+Math.cos(x*0.025)*8;ctx.lineTo(x,y);}
ctx.lineTo(logicalWidth,logicalHeight);ctx.fill();

let mi=Math.floor(matchTime/60),se=Math.floor(matchTime%60);
document.getElementById('timeIndicator').textContent=`${dp<1?`🌙 ${Math.floor(dp*100)}%`:'☀️ DIA'} - ${mi.toString().padStart(2,'0')}:${se.toString().padStart(2,'0')}`;

ctx.beginPath();ctx.moveTo(0,logicalHeight);ctx.lineTo(0,getTerrainY(0));
for(let x=0;x<=logicalWidth;x+=2)ctx.lineTo(x,getTerrainY(x));
ctx.lineTo(logicalWidth,logicalHeight);
let terrGrad=ctx.createLinearGradient(0,logicalHeight*0.4,0,logicalHeight);
terrGrad.addColorStop(0,'#4a3728');terrGrad.addColorStop(0.2,'#302217');terrGrad.addColorStop(1,'#18100a');
ctx.fillStyle=terrGrad;ctx.fill();

ctx.strokeStyle='#1b1008';ctx.lineWidth=2;
for(let x=10;x<logicalWidth;x+=25){let ty=getTerrainY(x);ctx.beginPath();ctx.moveTo(x,ty+4);ctx.lineTo(x+Math.sin(x)*8,ty+18);ctx.stroke();}

ctx.beginPath();ctx.moveTo(0,getTerrainY(0));
for(let x=0;x<=logicalWidth;x+=2)ctx.lineTo(x,getTerrainY(x));
ctx.strokeStyle='#2e7d32';ctx.lineWidth=4;ctx.stroke();
ctx.strokeStyle='#4caf50';ctx.lineWidth=2;ctx.stroke();

for(const r of rocks){
ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.angle);ctx.beginPath();
ctx.moveTo(r.vertices[0].x,r.vertices[0].y);
for(let v=1;v<r.vertices.length;v++)ctx.lineTo(r.vertices[v].x,r.vertices[v].y);
ctx.closePath();
let rGrad=ctx.createLinearGradient(-r.radius,-r.radius,r.radius,r.radius);
rGrad.addColorStop(0,'#7f8c8d');rGrad.addColorStop(1,'#2c3e50');
ctx.fillStyle=rGrad;ctx.fill();ctx.strokeStyle='#111';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();
}

tanks.forEach(t=>drawStickman(t));

effects.forEach(e=>{
ctx.save();
if(e.type==='fire'){
ctx.beginPath();ctx.arc(e.x,e.y,e.size*e.life,0,Math.PI*2);
ctx.fillStyle=e.color;ctx.globalAlpha=e.life;ctx.fill();
}else if(e.type==='smoke'){
ctx.beginPath();ctx.arc(e.x,e.y,e.size,0,Math.PI*2);
ctx.fillStyle='rgba(60,50,60,0.4)';ctx.globalAlpha=e.life*0.6;ctx.fill();
}else if(e.type==='debris'){
ctx.beginPath();ctx.rect(e.x,e.y,e.size,e.size);
ctx.fillStyle='#2c3e50';ctx.globalAlpha=e.life;ctx.fill();
}else if(e.type==='shockwave'){
e.radius+=(e.maxRadius-e.radius)*.18;
ctx.beginPath();ctx.arc(e.x,e.y,e.radius,0,Math.PI*2);
ctx.strokeStyle=`rgba(255,165,0,${e.life})`;ctx.lineWidth=4*e.life;ctx.stroke();
}
ctx.restore();
});

if(targetCursor.active){
ctx.save();
ctx.strokeStyle='#f1c40f';ctx.lineWidth=2;
ctx.beginPath();ctx.arc(targetCursor.x,targetCursor.y,12,0,Math.PI*2);ctx.stroke();
ctx.beginPath();ctx.moveTo(targetCursor.x-16,targetCursor.y);ctx.lineTo(targetCursor.x+16,targetCursor.y);ctx.stroke();

ctx.restore();
}

projectiles.forEach(p=>{

function drawStickman(s){
if(s.health<=0)return;
ctx.save();
if(s.shootTimer>0)s.shootTimer--;
if(s.isMoving)s.walkCycle+=.35;

const cx=s.x+s.width/2,by=s.y+s.height;
const hr=5,hy=s.y+hr,ny=hy+hr,hpy=by-10,ll=10;
const isGreen=s.team==='green';
const bodyColor='#111111';
const gearColor=isGreen?'#27ae60':'#e74c3c';
const gunColor=isGreen?'#1e824c':'#c0392b';

ctx.strokeStyle=bodyColor;ctx.fillStyle=bodyColor;ctx.lineWidth=3;
ctx.lineCap='round';ctx.lineJoin='round';

let la=s.isMoving?Math.sin(s.walkCycle)*.6:0;
ctx.beginPath();ctx.moveTo(cx,hpy);ctx.lineTo(cx+Math.sin(la)*ll*s.facing,hpy+Math.cos(la)*ll);ctx.stroke();
ctx.beginPath();ctx.moveTo(cx,hpy);ctx.lineTo(cx+Math.sin(-la)*ll*s.facing,hpy+Math.cos(-la)*ll);ctx.stroke();

ctx.beginPath();ctx.moveTo(cx,ny);ctx.lineTo(cx,hpy);ctx.stroke();

ctx.fillStyle=gearColor;
ctx.beginPath();ctx.arc(cx+s.facing,hpy+3,3,0,Math.PI*2);ctx.fill();

ctx.beginPath();ctx.arc(cx,hy,hr,0,Math.PI*2);
ctx.fillStyle=bodyColor;ctx.fill();ctx.stroke();

ctx.fillStyle=gearColor;
ctx.beginPath();ctx.arc(cx,hy-1,hr+1,Math.PI,Math.PI*2);ctx.fill();
ctx.fillRect(cx-hr-1,hy-2,(hr+1)*2,2);

ctx.fillStyle='#ffffff';
ctx.fillRect(cx+(s.facing*2)-2,hy-1,4,2);
ctx.strokeStyle='#111';ctx.lineWidth=1;
ctx.strokeRect(cx+(s.facing*2)-2,hy-1,4,2);

const sh=ny+2;
const ar=s.angle*Math.PI/180;

ctx.save();
ctx.translate(cx,sh);

let drawAngle = (s.facing === 1) ? -ar : (Math.PI + ar);
ctx.rotate(drawAngle);

let cannonLen=18,cannonWidth=7;
let cGrad=ctx.createLinearGradient(0,-cannonWidth/2,0,cannonWidth/2);
cGrad.addColorStop(0,'#555');cGrad.addColorStop(0.5,gunColor);cGrad.addColorStop(1,'#111');

ctx.fillStyle=cGrad;ctx.strokeStyle='#000';ctx.lineWidth=1.5;
ctx.fillRect(0,-cannonWidth/2,cannonLen,cannonWidth);
ctx.strokeRect(0,-cannonWidth/2,cannonLen,cannonWidth);
ctx.fillRect(cannonLen-2,-cannonWidth/2-1,3,cannonWidth+2);

ctx.fillStyle='#d35400';
ctx.beginPath();ctx.arc(3,0,6,0,Math.PI*2);ctx.fill();ctx.stroke();

ctx.restore();

ctx.strokeStyle=bodyColor;ctx.lineWidth=3;
let armX=cx+Math.cos(ar)*7*s.facing,armY=sh-Math.sin(ar)*7;
ctx.beginPath();ctx.moveTo(cx,sh);ctx.lineTo(armX,armY);ctx.stroke();

ctx.restore();
}

function updateProjectile(){
if(projectiles.length===0)return;

for(let i=projectiles.length-1; i>=0; i--){
let p = projectiles[i];
const steps = 3;

if(p.isGuided){
p.lifeTime += 1;
if(p.lifeTime > 12){
const dx = p.targetX - p.x;
const dy = p.targetY - p.y;
const targetAngle = Math.atan2(dy, dx);
const currentSpeed = 5.2;

const curAngle = Math.atan2(p.vy, p.vx);
let angleDiff = targetAngle - curAngle;

while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;

const newAngle = curAngle + angleDiff * 0.18;
p.vx = Math.cos(newAngle) * currentSpeed;
p.vy = Math.sin(newAngle) * currentSpeed;
}
}

const subVx = p.vx / steps;
const subVy = p.vy / steps;
const subG = p.gravity / steps;

for(let step=0; step<steps; step++){
p.vy += subG;
p.x += subVx;
p.y += subVy;

let hit=false;
let directHitTarget=null;

for(let t of tanks){
if(t.health<=0||t.id===p.shooterId)continue;

const boxX=t.x-8;
const boxY=t.y-8;
const boxWidth=t.width+16;
const boxHeight=t.height+16;

if(p.x>=boxX&&p.x<=boxX+boxWidth&&p.y>=boxY&&p.y<=boxY+boxHeight){
hit=true;
directHitTarget=t;
break;
}
}

if(!hit&&p.y+p.radius>=getTerrainY(p.x)){
hit=true;
}

if(hit){
destroyTerrain(p.x,p.explosionRadius,p.damage);
tanks.forEach(t=>updateTankY(t));

tanks.forEach(t=>{
if(t.health<=0)return;

const cx=t.x+t.width/2;
const cy=t.y+t.height/2;
const dist=Math.hypot(p.x-cx,p.y-cy);

if(t===directHitTarget||dist<=p.explosionRadius+20){
let dmg=p.damage;

if(t!==directHitTarget&&dist>12){
dmg=Math.max(10,Math.floor(p.damage*(1-(dist/(p.explosionRadius+20)))));
}

t.health=Math.max(0,t.health-dmg);
}
});

updateHealthBars();
AudioFX.playExplosion();
projectiles.splice(i, 1);
break;
}
}
}

if(projectiles.length===0){
isShooting=false;
if(!checkWin())nextTurn();
}
}

// INTELIGÊNCIA ARTIFICIAL PRECISA (SIMULAÇÃO REAL DE TRAJETÓRIA)
function executeAIShot(at){
if(at.health<=0)return;
const targets=tanks.filter(t=>t.team!==at.team&&t.health>0);
if(!targets.length)return;

let target = targets[0];
let tcx = target.x + target.width/2;
let tcy = target.y + target.height/2;
let acx = at.x + at.width/2;
let acy = at.y + at.height/2;

at.facing = (tcx > acx) ? 1 : -1;
let distance = Math.abs(tcx - acx);
let heightDiff = tcy - acy;

// Simulação balística real para encontrar ângulo e força ótimos
let bestAngle = 45;
let bestPower = 50;
let minError = 999999;

// Testa combinações de ângulo (20° a 70°) e força (25% a 95%)
for(let ang = 20; ang <= 70; ang += 2) {
  for(let pow = 25; pow <= 95; pow += 3) {
    let rad = ang * Math.PI / 180;
    let pm = .5 + (pow / 100) * 2.2;
    let bs = weapons[0].speed * pm * (logicalWidth / 12);
    let vx = Math.cos(rad) * bs * at.facing;
    let vy = -Math.sin(rad) * bs;
    
    // Simula a trajetória passo a passo
    let simX = acx + Math.cos(rad)*18*at.facing;
    let simY = acy - Math.sin(rad)*18;
    let simVy = vy;
    let hitX = simX;
    
    for(let step = 0; step < 120; step++) {
      simVy += weapons[0].gravity;
      simX += vx;
      simY += simVy;
      if(simY >= getTerrainY(simX)) {
        hitX = simX;
        break;
      }
    }
    
    let error = Math.abs(hitX - tcx);
    if(error < minError) {
      minError = error;
      bestAngle = ang;
      bestPower = pow;
    }
  }
}

at.angle = bestAngle;
at.power = Math.max(20, Math.min(100, bestPower));

document.getElementById('aiAmmoIndicator').textContent=`🤖 Robô calculou (Mira: ${bestAngle}°, Força: ${Math.floor(at.power)}%)`;
document.getElementById('aiAmmoIndicator').style.display='block';

fireProjectile();
}

}
}
}

function setupConnectionListeners() {
  conn.on('data', (data) => {
    if(data.type === 'STAGE_DATA') {
      let scaleX = logicalWidth / data.hostWidth;
      
      terrainHeights = new Float32Array(Math.ceil(logicalWidth) + 1);
      let rawH = data.terrainHeights;
      for(let x=0; x<=logicalWidth; x++) {
        let srcX = Math.min(rawH.length - 1, Math.floor(x / scaleX));
        terrainHeights[x] = rawH[srcX];
      }

      tanks = data.tanks.map(tk => ({...tk, x: tk.x * scaleX}));
      peakXsCache = data.peakXsCache.map(px => px * scaleX);
      rocks = data.rocks.map(r => ({...r, x: r.x * scaleX, peakRef: r.peakRef * scaleX}));

      const modal = document.getElementById('gameModal');
      if(modal) {
        modal.classList.remove('active');
        modal.style.display = 'none';
      }
      updateHealthBars();
      isShooting = false;
      projectiles = [];
    } else if(data.type === 'MOVE') {
      let t = tanks[data.tankIndex];
      if(t) { t.x = data.x; t.facing = data.facing; t.isMoving = true; updateTankY(t); }
    } else if(data.type === 'ANGLE') {
      let t = tanks[data.tankIndex];
      if(t) { t.angle = data.angle; }
    } else if(data.type === 'POWER') {
      let t = tanks[data.tankIndex];
      if(t) { t.power = data.power; }
    } else if(data.type === 'FIRE') {
      executeFireAction(data.tankIndex, data.weapon, data.angle, data.power, data.targetX, data.targetY);
    } else if(data.type === 'START') {
      startMultiplayerGame();
    }
  });
}

function startMultiplayerGame() {
  isMultiplayer = true;
  if(isHost && conn) { 
    conn.send({type: 'START'}); 
    sendStageDataToClient();

  const modal = document.getElementById('gameModal');

  projectiles = [];
}

const k = e.key;
const code = e.code;
const keyCode = e.keyCode;

if (keyState[code || k]) return;
keyState[code || k] = true;

if (code === 'Digit4' || code === 'Numpad4' || keyCode === 52 || keyCode === 100 || k === 'ArrowLeft') {
moveDir = -1;
moveLeftBtn.classList.add('active-key');
e.preventDefault();
}

if (code === 'Digit6' || code === 'Numpad6' || keyCode === 54 || keyCode === 102 || k === 'ArrowRight') {
moveDir = 1;
moveRightBtn.classList.add('active-key');
e.preventDefault();
}

if (code === 'Digit2' || code === 'Numpad2' || keyCode === 50 || keyCode === 98 || k === 'ArrowUp') {
angleDir = 1;
anglePlusBtn.classList.add('active-key');
e.preventDefault();
}

if (code === 'Digit8' || code === 'Numpad8' || keyCode === 56 || keyCode === 104 || k === 'ArrowDown') {
angleDir = -1;
angleMinusBtn.classList.add('active-key');
e.preventDefault();
}

if (code === 'Digit1' || code === 'Numpad1' || keyCode === 49 || keyCode === 97 || k === 'a' || k === 'A') {
forceDir = -1;
forceMinusBtn.classList.add('active-key');
e.preventDefault();
}

if (code === 'Digit3' || code === 'Numpad3' || keyCode === 51 || keyCode === 99 || k === 's' || k === 'S') {
forceDir = 1;
forcePlusBtn.classList.add('active-key');
e.preventDefault();
}

if (code === 'Digit5' || code === 'Numpad5' || keyCode === 53 || keyCode === 101 || k === ' ' || k === 'Space' || k === 'Enter' || keyCode === 13 || keyCode === 29443 || keyCode === 10252) {
fireBtn.classList.add('active-key');
const a = tanks[currentTankIndex];
if (a && (!isMultiplayer || currentTankIndex === localPlayerId) && !isShooting) {
fireProjectile();
}
e.preventDefault();
}
});

window.addEventListener('keyup', e => {
const k = e.key;
const code = e.code;
const keyCode = e.keyCode;

delete keyState[code || k];

if (code === 'Digit4' || code === 'Numpad4' || keyCode === 52 || keyCode === 100 || k === 'ArrowLeft') {
if (moveDir === -1) moveDir = 0;
moveLeftBtn.classList.remove('active-key');
}

if (code === 'Digit6' || code === 'Numpad6' || keyCode === 54 || keyCode === 102 || k === 'ArrowRight') {
if (moveDir === 1) moveDir = 0;
moveRightBtn.classList.remove('active-key');
}

if (code === 'Digit2' || code === 'Numpad2' || keyCode === 50 || keyCode === 98 || k === 'ArrowUp') {
if (angleDir === 1) angleDir = 0;
anglePlusBtn.classList.remove('active-key');
}

if (code === 'Digit8' || code === 'Numpad8' || keyCode === 56 || keyCode === 104 || k === 'ArrowDown') {
if (angleDir === -1) angleDir = 0;
angleMinusBtn.classList.remove('active-key');
}

if (code === 'Digit1' || code === 'Numpad1' || keyCode === 49 || keyCode === 97 || k === 'a' || k === 'A') {
if (forceDir === -1) forceDir = 0;
forceMinusBtn.classList.remove('active-key');
}

if (code === 'Digit3' || code === 'Numpad3' || keyCode === 51 || keyCode === 99 || k === 's' || k === 'S') {
if (forceDir === 1) forceDir = 0;
forcePlusBtn.classList.remove('active-key');
}

if (code === 'Digit5' || code === 'Numpad5' || keyCode === 53 || keyCode === 101 || k === ' ' || k === 'Space' || k === 'Enter' || keyCode === 13 || keyCode === 29443 || keyCode === 10252) {
fireBtn.classList.remove('active-key');
}
});

resizeCanvas();initStage();gameLoop();
</script>
